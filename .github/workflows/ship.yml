# Ship checks — after every successful Vercel deploy (docs/GUARDRAILS_PLAN.md, Phase 2 item 8; owner decision 4).
#
# Anonymous only, and read-only: the sign-in page renders with no errors, the dashboard and API refuse a
# stranger, an unknown page is a 404, search engines are told to stay out, no source maps are public. Production
# is also checked on its real domain, where Vercel does NOT add its own noindex header.
#
# Preview deploys ALSO get the signed-in crawl (owner, 2026-10-01, docs/OPEN-QUESTIONS.md Q1): every e2e account
# (<role>@views.check, seeded on the dev database by scripts/seed-preview-e2e.mjs) opens every page it can reach;
# it fails on signed-out / 404 / 5xx / uncaught exception / blank. It needs the E2E_PREVIEW_PASSWORD secret and
# skips (green) until the owner sets it. Production never gets a signed-in run.
#
# deployment_status workflows always run from the DEFAULT branch's copy of this file.
name: ship
on:
  deployment_status:
permissions:
  contents: read
  packages: read
jobs:
  ship:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@crittercodes'
      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - name: Check the deploy
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: |
          urls="$DEPLOY_URL"
          if [ "$ENVIRONMENT" = "Production" ]; then
            # The domain moves to the new deploy just after Vercel reports success.
            sleep 60
            urls="$urls https://admin.engelfinedesign.com"
          fi
          node scripts/ship-checks.mjs $urls
      - name: Signed-in crawl (preview deploys only)
        if: github.event.deployment.environment == 'Preview'
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          E2E_PREVIEW_PASSWORD: ${{ secrets.E2E_PREVIEW_PASSWORD }}
        run: node scripts/views-remote.mjs "$DEPLOY_URL"
      - if: always() && github.event.deployment.environment == 'Preview'
        uses: actions/upload-artifact@v4
        with:
          name: preview-contact-sheet
          path: e2e/views/out
          if-no-files-found: ignore
          retention-days: 14
