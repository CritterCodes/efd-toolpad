# Ship checks — after every successful Vercel deploy (docs/GUARDRAILS_PLAN.md, Phase 2 item 8; owner decision 4).
#
# Anonymous only, and read-only: the sign-in page renders with no errors, the dashboard and API refuse a
# stranger, an unknown page is a 404, search engines are told to stay out, no source maps are public. Production
# is also checked on its real domain, where Vercel does NOT add its own noindex header.
#
# Signed-in checks on previews would need standing accounts + passwords in the dev database and in GitHub; that
# is an open question for the owner (docs/OPEN-QUESTIONS.md). The signed-in every-role crawl runs on every PR in
# ci.yml (`npm run views`) instead.
#
# deployment_status workflows always run from the DEFAULT branch's copy of this file.
name: ship
on:
  deployment_status:
permissions:
  contents: read
  packages: read
jobs:
  ship:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@crittercodes'
      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - name: Check the deploy
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: |
          urls="$DEPLOY_URL"
          if [ "$ENVIRONMENT" = "Production" ]; then
            # The domain moves to the new deploy just after Vercel reports success.
            sleep 60
            urls="$urls https://admin.engelfinedesign.com"
          fi
          node scripts/ship-checks.mjs $urls
